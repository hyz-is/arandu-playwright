# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the
# application it runs in and never opens an installed package, so
# tests/Unit/audit_test.go compares these four lines with what the code calls,
# counting what it asks playwright-go to do on its behalf.
#
# This is test tooling: an application imports it from tests/TestCase.go,
# under the e2e build tag, and links none of it into the server it deploys.

name = "hyz-is/playwright"
framework = ">= 0.63"
profiles = ["conventional", "performance"]

[permissions]
# Install downloads the Playwright driver (the playwright-core package from the
# npm registry and a Node runtime from nodejs.org) and the browsers from
# Playwright's CDN. Launch downloads nothing.
network = true
# The driver and the browsers are written to, and read from, the user's cache
# directory (ms-playwright-go and ms-playwright), never the project.
filesystem = true
# Launch runs the Playwright driver, a Node process, which starts the
# browsers; Install runs the driver's installer.
exec = true
# It owns no table.
migrations = false
